# ============================================================
# eski.muhammedikbalbakirci.com icin HIZLANDIRMA
#
# Plesk > eski.muhammedikbalbakirci.com
#      > Apache ve nginx Ayarlari > "Ek nginx yonergeleri"
#
# OLCUM (2026-09-13):
#   sunucu ilk bayt : 0.086 s   -> sunucu HIZLI, sorun o degil
#   gzip            : KAPALI    -> 6.33 MB metin sikistirilmadan gidiyor
#   cache basligi   : YOK       -> her ziyarette 49 dosya yeniden dogrulaniyor
#   en agir dosyalar: jquery-ui.js 508 KB, style.css 287 KB, all.css 199 KB
# ============================================================


# --- 1) GZIP: en buyuk kazanc ---
# 6.33 MB'lik CSS/JS/HTML tipik olarak ~1.5 MB'a iner.
gzip              on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_vary         on;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/ttf
    application/vnd.ms-fontobject;

# NOT: woff/woff2 ve jpg/png/webp listede YOK - onlar zaten sikistirilmis.
# Tekrar sikistirmak CPU harcar, boyutu kucultmez.


# --- 2) STATIK DOSYA ONBELLEGI: tekrar ziyaretlerde en buyuk kazanc ---
# Arsiv donuk bir kopya; dosyalar bir daha degismeyecek.
# Bu yuzden uzun sureli onbellek guvenli.
location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    access_log off;
}


# --- 3) HTML: kisa onbellek ---
location ~* \.html$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}


# --- 4) Arama motorlarina kapali tut (arsiv indekslenmesin) ---
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;


# ============================================================
# BU AYARLARIN COZMEDIGI SEY
#
# style.css su satirla basliyor:
#     @import url('https://fonts.googleapis.com/css?family=...')
#
# Tarayici once style.css'i indirip ayristiriyor, ANCAK ONDAN SONRA
# Google Fonts'a gidiyor. Seri (zincirleme) istek, render'i bloklar.
#
# Cozmek istersen: style.css'in ilk satirlarindaki @import'lari silip
# ayni adresleri HTML'in <head> bolumune <link rel="stylesheet"> olarak
# tasimak gerekir - boylece paralel inerler.
#
# Ama bu 100 sayfada HTML degisikligi demek ve arsivin orijinalligini bozar.
# Arsiv icin onerilmez; gzip + onbellek zaten asil kazanci veriyor.
# ============================================================

# ============================================================
# ANA DOMAIN icin ek nginx yonergeleri
# Plesk > muhammedikbalbakirci.com > Apache ve nginx Ayarlari
#        > "Ek nginx yonergeleri" kutusuna yapistir
#
# Amac: Yeni statik sitede karsiligi olmayan 88 eski URL'yi
#       eski.muhammedikbalbakirci.com uzerindeki ayni adrese 301 gonder.
#
# ONEMLI: Bu kurallari eklemeden once eski.muhammedikbalbakirci.com
#         calisir durumda olmali (Rehber Adim 5).
# ============================================================

# --- Bolum sayfalari: /haberdetay/... /makale/... /foto/... vb. (74 URL) ---
location ~ ^/(haberdetay|makale|foto|video|urun|urun-kategori|mavi|mavi-kategori)/ {
    return 301 https://eski.muhammedikbalbakirci.com$request_uri;
}

# --- Eski ust menu sayfalari (11 URL) ---
location ~ ^/(belgelerimiz|sss|ekibimiz|musteri-gorusleri|insan-kaynaklari|urunler|mavialan|makaleler|haberler|foto-galeri|video-galeri)/?$ {
    return 301 https://eski.muhammedikbalbakirci.com$request_uri;
}

# --- /icerik/ altinda yeni sitede KARSILIGI OLMAYANLAR (3 URL) ---
# DIKKAT: /icerik/biyografi ve /icerik/gece-yolculugu-dua-si yeni build'de
# zaten mevcut (/hakkinda'ya yonlendiren stub dosyalar). Onlara dokunma.
location ~ ^/icerik/(icindeki|umuttan-bir-yol|bayrak)/?$ {
    return 301 https://eski.muhammedikbalbakirci.com$request_uri;
}

# --- Sprint 1 (2026-10): bilerek kaldirilan sayfalar ---
# 410 Gone: icerik kalici olarak kaldirildi; Google dizinden hizla cikarir.
location ~ ^/(basari-hikayeleri|podcast|kurslar|soylesiler)/?$ {
    return 410;
}

# --- SEO denetimi (2026-10): /icerik/ stub'lari yeni build'de yok -> 301 /hakkinda ---
location ~ ^/icerik/(biyografi|gece-yolculugu-dua-si)/?$ {
    return 301 /hakkinda;
}

# --- SEO denetimi (2026-10): tek adres = canonical adres ---
# Site artik sayfa basina tek dosya uretiyor (hakkinda.html, blog/botoks.html).
# 1) Sondaki "/" kaldirilir: /hakkinda/ -> 301 /hakkinda  (ana sayfa haric)
rewrite ^/(.+)/$ /$1 permanent;
# 2) Uzantisiz adres ayni isimli .html dosyasindan sunulur: /hakkinda -> hakkinda.html (200, yonlendirme yok)
if (-f $document_root$uri.html) {
    rewrite ^ $uri.html last;
}
# 3) .html ile gelen istek uzantisiz adrese tasinir: /hakkinda.html -> 301 /hakkinda
if ($request_uri ~ ^/(.+)\.html$) {
    return 301 /$1;
}

# --- Ozel 404 sayfasi (noindex) ---
error_page 404 /404.html;

# --- Guvenlik basliklari ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS: once HTTPS'in hem www hem kok alanda sorunsuz calistigindan emin olun.
add_header Strict-Transport-Security "max-age=15552000" always;

# --- Onbellek: Astro'nun hash'li dosyalari degismez ---
location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# NOT: https://muhammedikbalbakirci.com (www'suz) bugun 200 donuyor.
# Plesk > Alan adi > Hosting ayarlari > "Tercih edilen alan adi" = www.muhammedikbalbakirci.com
# secilirse www'suz istekler 301 ile www'ya gider; bunun icin ek kural gerekmez.

# --- SEO denetimi (2026-10): birlestirilen yazilar -> 301 ---
location = /blog/prp-mi-eksozom-mu { return 301 /blog/prp-eksozom; }
